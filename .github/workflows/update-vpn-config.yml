name: Update VPN config

on:
  push:
    branches: [main]
  schedule:
    # Максимальная частота в GitHub Actions — раз в минуту (30 сек cron не поддерживает)
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch free-nodes/v2rayfree as slot 1 (replaces dead 1-26 upstream)
        run: |
          mkdir -p configs
          MAX=300
          curl -sLf "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub" -o sub.b64 || true
          touch sub.b64
          base64 -d sub.b64 > full.txt 2>/dev/null || true
          touch full.txt
          grep -E '^(vless|trojan|vmess|ss|hy2)://' full.txt > filtered.txt || true
          N=$(wc -l < filtered.txt)
          if [ "$N" -eq 0 ] || [ "$N" -lt "$MAX" ]; then
            cp filtered.txt new.txt
          else
            awk -v T="$N" -v target="$MAX" 'int((NR-1)*target/T) != int((NR-2)*target/T)' filtered.txt > new.txt
          fi
          if [ ! -s new.txt ] && [ -s filtered.txt ]; then cp filtered.txt new.txt; fi
          if [ -s new.txt ]; then
            echo "# Подписка 1.1 | free-nodes/v2rayfree (короткий)" > "configs/1.1.txt"
            cat new.txt >> "configs/1.1.txt"
            echo "  configs/1.1.txt: $(wc -l < new.txt) servers"
          else
            echo "  configs/1.1.txt: no configs, skipped"
          fi

      - name: Fetch igareck/vpn-configs-for-russia (27–34); 28/32/33 as N.1+N.2
        run: |
          BASE="https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main"
          MAX=300
          n=27
          titles='Shadowsocks+All (чёрный)|VLESS все (чёрный)|VLESS 150 (чёрный)|CIDR белый mobile 1|CIDR белый mobile 2|CIDR белый все|CIDR VK/Ya/CDN/Beeline|SNI белый список'
          for name in "BLACK_SS%2BAll_RUS.txt" "BLACK_VLESS_RUS.txt" "BLACK_VLESS_RUS_mobile.txt" \
                      "Vless-Reality-White-Lists-Rus-Mobile.txt" "Vless-Reality-White-Lists-Rus-Mobile-2.txt" \
                      "WHITE-CIDR-RU-all.txt" "WHITE-CIDR-RU-checked.txt" "WHITE-SNI-RU-all.txt"; do
            curl -sLf "${BASE}/${name}" -o full.txt || true
            touch full.txt
            grep -E '^(vless|trojan|vmess|ss|hy2)://' full.txt > filtered.txt || true
            N=$(wc -l < filtered.txt)
            if [ "$N" -eq 0 ]; then
              cp filtered.txt new.txt
            elif [ "$N" -lt "$MAX" ]; then
              cp filtered.txt new.txt
            else
              quarter=$((N / 4))
              if [ "$quarter" -le "$MAX" ]; then
                awk 'NR % 4 == 1' filtered.txt > new.txt
              else
                awk -v T="$N" -v target="$MAX" 'int((NR-1)*target/T) != int((NR-2)*target/T)' filtered.txt > new.txt
              fi
            fi
            if [ ! -s new.txt ] && [ -s filtered.txt ]; then cp filtered.txt new.txt; fi
            title=$(echo "$titles" | cut -d'|' -f$((n-26)))
            if [ "$n" -eq 28 ] || [ "$n" -eq 32 ] || [ "$n" -eq 33 ]; then
              if [ -s new.txt ]; then
                echo "# Подписка ${n}.1 | $title (igareck, короткий)" > "configs/${n}.1.txt"
                cat new.txt >> "configs/${n}.1.txt"
                echo "  configs/${n}.1.txt: $(wc -l < new.txt) servers (from ${name})"
              fi
              if [ -s filtered.txt ]; then
                echo "# Подписка ${n}.2 | $title (igareck, полный)" > "configs/${n}.2.txt"
                cat filtered.txt >> "configs/${n}.2.txt"
                echo "  configs/${n}.2.txt: $(wc -l < filtered.txt) servers (full)"
              fi
            else
              if [ -s new.txt ]; then
                echo "# Подписка $n | $title (igareck)" > "configs/${n}.txt"
                cat new.txt >> "configs/${n}.txt"
                echo "  configs/${n}.txt: $(wc -l < new.txt) servers (from ${name})"
              else
                echo "  configs/${n}.txt: no configs, skipped (${name})"
              fi
            fi
            n=$((n + 1))
          done

      - name: Fetch full list (1.2) from free-nodes/v2rayfree
        run: |
          curl -sLf "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub" -o sub.b64 || true
          touch sub.b64
          base64 -d sub.b64 > full.txt 2>/dev/null || true
          touch full.txt
          grep -E '^(vless|trojan|vmess|ss|hy2)://' full.txt > filtered.txt || true
          echo "# Подписка 1.2 | free-nodes/v2rayfree (полный)" > "configs/1.2.txt"
          cat filtered.txt >> "configs/1.2.txt"
          echo "  configs/1.2.txt: $(wc -l < filtered.txt) servers"

      - name: Generate counts.json (per-config and total unique servers)
        run: |
          echo '{' > configs/counts.json
          for i in 1; do
            for s in 1 2; do
              key="${i}.${s}"
              c=0
              [ -f "configs/${key}.txt" ] && c=$(grep -cE '^(vless|trojan|vmess|ss|hy2)://' "configs/${key}.txt" 2>/dev/null || true)
              echo "  \"$key\": ${c:-0}," >> configs/counts.json
            done
          done
          for i in 27 29 30 31 34; do
            c=0
            [ -f "configs/${i}.txt" ] && c=$(grep -cE '^(vless|trojan|vmess|ss|hy2)://' "configs/${i}.txt" 2>/dev/null || true)
            echo "  \"$i\": ${c:-0}," >> configs/counts.json
          done
          for i in 28 32 33; do
            for s in 1 2; do
              key="${i}.${s}"
              c=0
              [ -f "configs/${key}.txt" ] && c=$(grep -cE '^(vless|trojan|vmess|ss|hy2)://' "configs/${key}.txt" 2>/dev/null || true)
              echo "  \"$key\": ${c:-0}," >> configs/counts.json
            done
          done
          total=$( ( for i in 1; do for s in 1 2; do [ -f "configs/${i}.${s}.txt" ] && grep -E '^(vless|trojan|vmess|ss|hy2)://' "configs/${i}.${s}.txt"; done; done; for i in 27 29 30 31 34; do [ -f "configs/${i}.txt" ] && grep -E '^(vless|trojan|vmess|ss|hy2)://' "configs/${i}.txt"; done; for i in 28 32 33; do for s in 1 2; do [ -f "configs/${i}.${s}.txt" ] && grep -E '^(vless|trojan|vmess|ss|hy2)://' "configs/${i}.${s}.txt"; done; done ) 2>/dev/null | sort -u | wc -l)
          echo "  \"totalUnique\": $total" >> configs/counts.json
          echo '}' >> configs/counts.json
          echo "  totalUnique: $total servers (no duplicates)"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/
          git add -u
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git status --short
            git commit -m "chore: update VPN configs ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
